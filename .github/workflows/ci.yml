name: CI and container delivery

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edition-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python -m pip install -r requirements.txt
      - name: Train temporal lifecycle candidate
        run: python backend/train_lifecycle.py --output data/training/candidate.json
      - name: Unit, inference parity and HTTP integration tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  analytics:
    name: Unified app and warehouse checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-analytics.txt
            requirements-kkbox.txt
      - run: python -m pip install -r requirements-analytics.txt -r requirements-kkbox.txt
      - name: KKBOX import, leakage checks, training and portable inference
        run: python -m unittest discover -s tests -p 'test_kkbox.py' -v
      - run: python -m unittest discover -s tests -p 'test_streamlit_app.py' -v
      - run: python -m unittest discover -s tests -p 'test_warehouse.py' -v
      - run: python backend/warehouse.py plan

  container:
    name: Container build and smoke test
    needs: [python, analytics]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build runtime image
        run: docker build --tag edition:test .
      - name: Start restricted runtime
        run: docker run --detach --name edition-ci --tmpfs /app/data:mode=1777 --tmpfs /tmp --read-only --cap-drop ALL --security-opt no-new-privileges:true --publish 127.0.0.1:4173:4173 --publish 127.0.0.1:8501:8501 edition:test
      - name: Smoke test the running container
        run: python3 scripts/smoke-container.py http://127.0.0.1:4173
      - name: Runtime logs
        if: always()
        run: docker logs edition-ci || true
      - name: Stop runtime
        if: always()
        run: docker rm --force edition-ci || true

  publish:
    name: Publish validated image to GHCR
    needs: [python, analytics, container]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Compute lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag
      - name: Publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
